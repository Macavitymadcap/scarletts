<!-- @dsCard group="Pages" height=1300 width=1280 page subtitle="Music page mock-up at desktop width" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Music page mock-up</title>
<style>
  body { margin: 0; overflow-x: hidden; }
  .page { min-height: 100vh; background: var(--paper); color: var(--ink); }
  .masthead { background: var(--night); color: var(--on-night); padding: var(--space-8) var(--space-4); border-bottom: var(--border-hard) solid var(--ink); }
  .masthead__kicker { margin: 0 0 var(--space-2); font-family: var(--font-stamp); font-size: 14px; line-height: 18px; letter-spacing: .5px; text-transform: uppercase; }
  .masthead__title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 1; letter-spacing: .5px; text-transform: uppercase; }
  .masthead__title mark { background: var(--scarlet); color: var(--on-scarlet); padding: 0 var(--space-2); }
  .masthead__intro { margin: var(--space-4) 0 0; font-size: 17px; line-height: 26px; max-width: 52ch; }
  .music { display: grid; gap: var(--space-8); padding: var(--space-8) var(--space-4); align-items: start; }
  .section__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-4); }
  .section__title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: .5px; text-transform: uppercase; }
  .section__meta { margin: 0; font-family: var(--font-stamp); font-size: 14px; line-height: 18px; color: var(--ink-muted); text-transform: uppercase; }
  .embed { box-sizing: border-box; width: 100%; max-width: 400px; height: 470px; display: grid; place-items: center; padding: var(--space-4); background: var(--night); color: var(--on-night); border: var(--border-hard) solid var(--ink); box-shadow: var(--shadow-offset); text-align: center; }
  .embed p { margin: 0; font-family: var(--font-stamp); font-size: 14px; line-height: 20px; text-transform: uppercase; letter-spacing: .5px; }
  .embed strong { display: block; margin-bottom: var(--space-2); font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
  .buy { margin-top: var(--space-8); display: flex; flex-wrap: wrap; gap: var(--space-4); }
  .fine { margin: var(--space-4) 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); max-width: 40ch; }
  .footer { background: var(--night); color: var(--on-night); padding: var(--space-8) var(--space-4); display: grid; gap: var(--space-4); }
  .footer a { color: var(--on-night); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 15px; }
  .footer a:focus-visible { outline: 3px solid var(--on-night); outline-offset: 3px; }
  .footer__links { display: flex; flex-wrap: wrap; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  .footer__mail { font-family: var(--font-stamp); font-size: 14px; margin: 0; }
  .footer__mail a { font-family: var(--font-stamp); font-weight: 400; text-transform: none; letter-spacing: .5px; }
  @media (min-width: 800px) {
    .masthead { padding: var(--space-8); }
    .masthead__title { font-size: 96px; line-height: .92; }
    .music { grid-template-columns: 7fr 5fr; padding: var(--space-8); }
    .footer { padding-left: var(--space-8); padding-right: var(--space-8); grid-template-columns: 1fr auto; align-items: center; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Scarletts, h = React.createElement;
  var page = h('div', {className: 'page'},
    h(S.Tricolour),
    h(S.Nav, {links: [{label: 'Home', href: '#'}, {label: 'Bio', href: '#bio'}, {label: 'Photos', href: '#photos'}, {label: 'Music', href: '#music', current: true}]}),
    h('header', {className: 'masthead'},
      h('p', {className: 'masthead__kicker'}, 'Music / Bristol'),
      h('h1', {className: 'masthead__title'}, 'Press ', h('mark', null, 'play')),
      h('p', {className: 'masthead__intro'}, 'Fresh from the recording session. Listen here, then grab them on Bandcamp.')),
    h('div', {className: 'music'},
      h('section', {'aria-labelledby': 'tracks'},
        h('div', {className: 'section__head'},
          h('h2', {className: 'section__title', id: 'tracks'}, 'Tracks'),
          h('p', {className: 'section__meta'}, '3 tracks')),
        h(S.TrackList, {tracks: [
          {title: 'Track title one', src: 'https://media.scarletts.uk/audio/track-01.mp3', duration: '3:42', isNew: true},
          {title: 'Track title two', src: 'https://media.scarletts.uk/audio/track-02.mp3', duration: '4:05'},
          {title: 'Track title three', src: 'https://media.scarletts.uk/audio/track-03.mp3', duration: '2:58'}]})),
      h('aside', {'aria-labelledby': 'buy'},
        h('div', {className: 'section__head'},
          h('h2', {className: 'section__title', id: 'buy'}, 'Buy it'),
          h(S.Tape, {tone: 'scarlet', tilt: 'left'}, 'Support the band')),
        h('div', {className: 'embed'},
          h('p', null, h('strong', null, 'Bandcamp player'), 'Embed goes here on the site', h('br'), '400 x 470')),
        h('div', {className: 'buy'},
          h(S.Button, {href: '#'}, 'Buy on Bandcamp')),
        h('p', {className: 'fine'}, 'Buying on Bandcamp puts the most money in the band’s pocket.'))),
    h(S.Checkerboard, {rows: 1}),
    h('footer', {className: 'footer'},
      h('ul', {className: 'footer__links'},
        h('li', null, h('a', {href: '#'}, 'Instagram')),
        h('li', null, h('a', {href: '#'}, 'YouTube')),
        h('li', null, h('a', {href: '#'}, 'Bandcamp'))),
      h('p', {className: 'footer__mail'}, 'Bookings: ', h('a', {href: 'mailto:bookings@scarletts.uk'}, 'bookings@scarletts.uk'))));
  ReactDOM.createRoot(document.getElementById('root')).render(page);
</script>
</body>
</html>
